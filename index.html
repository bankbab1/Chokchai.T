<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chokchai.T — Welcome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
<style>
  :root{
    --font-display:'Syne',sans-serif;
    --font-serif:'DM Serif Display',serif;
    --font-body:'DM Sans',system-ui,sans-serif;
  }
  html[data-theme="dark"]{
    --bg:#0a0b0f; --bg2:#0f1117; --surface:#13151d; --surface2:#1a1d28;
    --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.13);
    --text:#e8eaf0; --text2:#9399aa; --text3:#5c6070;
    --accent:#5b8def; --accent2:#3dd6c2; --accent3:#f0b06a;
    --accent-dim:rgba(91,141,239,.14);
    --shadow:0 20px 50px -20px rgba(0,0,0,.6);
  }
  html[data-theme="light"]{
    --bg:#f6f5f0; --bg2:#ffffff; --surface:#ffffff; --surface2:#faf9f4;
    --border:rgba(15,17,28,.08); --border2:rgba(15,17,28,.14);
    --text:#15161c; --text2:#5b6072; --text3:#8a8f9e;
    --accent:#2563eb; --accent2:#0d9488; --accent3:#c2742a;
    --accent-dim:rgba(37,99,235,.09);
    --shadow:0 20px 40px -22px rgba(15,17,28,.18);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:var(--font-body); background:var(--bg); color:var(--text);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; position:relative; overflow-x:hidden;
    transition:background .3s, color .3s;
  }
  /* Ambient gradient orbs */
  body::before, body::after{
    content:""; position:fixed; width:520px; height:520px; border-radius:50%;
    filter:blur(110px); opacity:.35; pointer-events:none; z-index:0;
  }
  body::before{background:var(--accent); top:-160px; left:-160px}
  body::after{background:var(--accent2); bottom:-180px; right:-180px; opacity:.28}

  .theme-toggle{
    position:fixed; top:20px; right:20px; z-index:10;
    width:42px; height:42px; border-radius:50%; border:1px solid var(--border2);
    background:var(--surface); color:var(--text); cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
    transition:all .25s;
  }
  .theme-toggle:hover{border-color:var(--accent); color:var(--accent); transform:rotate(15deg)}

  .landing-card{
    position:relative; z-index:1;
    background:var(--bg2); border:1px solid var(--border);
    border-radius:24px; padding:44px 36px 38px;
    max-width:460px; width:100%;
    box-shadow:var(--shadow);
    text-align:center;
    animation:fadeIn .8s ease-out;
  }
  .eyebrow{
    display:inline-block; font-family:var(--font-display); font-size:.72rem;
    font-weight:600; letter-spacing:.22em; text-transform:uppercase;
    color:var(--accent); background:var(--accent-dim);
    padding:6px 14px; border-radius:999px;
    border:1px solid color-mix(in oklab, var(--accent) 30%, transparent);
    margin-bottom:22px;
  }
  .avatar{
    width:140px; height:180px; margin:0 auto 22px;
    border-radius:18px; overflow:hidden;
    border:1px solid var(--border2);
    box-shadow:0 12px 30px -10px color-mix(in oklab, var(--accent) 35%, transparent);
    background:linear-gradient(135deg, var(--accent), var(--accent2));
  }
  .avatar img{width:100%; height:100%; object-fit:cover; display:block}
  h1{
    font-family:var(--font-display); font-weight:700;
    font-size:clamp(1.8rem, 4vw, 2.3rem); letter-spacing:-.02em;
    line-height:1.1; margin-bottom:10px;
  }
  h1 .accent{
    background:linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .role{
    font-family:var(--font-serif); font-style:italic;
    color:var(--text2); font-size:1.05rem; margin-bottom:18px;
  }
  .summary{
    color:var(--text2); font-size:.92rem; line-height:1.65;
    max-width:360px; margin:0 auto 28px;
  }
  .chips{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:30px;
  }
  .chip{
    display:inline-flex; align-items:center; gap:6px;
    padding:6px 12px; border-radius:999px;
    background:var(--surface); border:1px solid var(--border);
    font-size:.76rem; color:var(--text2);
  }
  .chip i{color:var(--accent); font-size:.7rem}
  .landing-btn{
    display:inline-flex; align-items:center; gap:10px;
    background:linear-gradient(135deg, var(--accent), var(--accent2));
    color:#fff; padding:14px 28px; font-size:.95rem; font-weight:600;
    font-family:var(--font-display); letter-spacing:.02em;
    border-radius:12px; text-decoration:none; border:none; cursor:pointer;
    transition:transform .2s, box-shadow .2s;
    box-shadow:0 10px 24px -10px color-mix(in oklab, var(--accent) 60%, transparent);
  }
  .landing-btn:hover{transform:translateY(-2px); box-shadow:0 16px 32px -10px color-mix(in oklab, var(--accent) 70%, transparent)}
  .landing-btn i{transition:transform .2s}
  .landing-btn:hover i{transform:translateX(4px)}
  .foot{
    margin-top:24px; font-size:.72rem; color:var(--text3);
    letter-spacing:.14em; text-transform:uppercase; font-family:var(--font-display);
  }
  @keyframes fadeIn{from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:translateY(0)}}
  @media (max-width:480px){
    .landing-card{padding:36px 24px 30px}
    .avatar{width:120px; height:155px}
  }
</style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme"><i class="fa-solid fa-moon"></i></button>

  <main class="landing-card">
    <span class="eyebrow">Portfolio · 2026</span>
    <div class="avatar"><img src="chok.jpg" alt="Chokchai Thawatcharaporn"></div>
    <h1>Chokchai <span class="accent">Thawatcharaporn</span></h1>
    <p class="role">Senior Digital Solution</p>
    <p class="summary">Welcome. Explore my CV, skills, and selected projects on the full profile.</p>
    
    <button class="landing-btn" id="viewProfileBtn">
      View Profile <i class="fa-solid fa-arrow-right"></i>
    </button>
    <div class="foot">Bangkok · Available for opportunities</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    // Theme
    const root = document.documentElement;
    const tBtn = document.getElementById('themeToggle');
    const saved = localStorage.getItem('theme') || 'dark';
    root.setAttribute('data-theme', saved);
    tBtn.innerHTML = saved === 'dark' ? '<i class="fa-solid fa-moon"></i>' : '<i class="fa-solid fa-sun"></i>';
    tBtn.addEventListener('click', () => {
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      tBtn.innerHTML = next === 'dark' ? '<i class="fa-solid fa-moon"></i>' : '<i class="fa-solid fa-sun"></i>';
    });

    // Visitor tracking
    const apiUrl = "https://script.google.com/macros/s/AKfycbxHYbCJNaLoVR3Q5mOruOA5lt15xoNwGWknsWbSlKzcwL_T-wtOJv6wnWzxWVCKAzxqEg/exec";
    let visitorId = localStorage.getItem("visitor_id");
    if (!visitorId) {
      visitorId = Math.random().toString(36).substring(2) + Date.now().toString(36);
      localStorage.setItem("visitor_id", visitorId);
    }
    function parseUserAgent() {
      const ua = navigator.userAgent;
      let browser = "Unknown", os = "Unknown";
      if (/edg/i.test(ua)) browser = "Edge";
      else if (/chrome|crios|crmo/i.test(ua)) browser = "Chrome";
      else if (/firefox|fxios/i.test(ua)) browser = "Firefox";
      else if (/safari/i.test(ua) && !/chrome/i.test(ua)) browser = "Safari";
      if (/windows/i.test(ua)) os = "Windows";
      else if (/android/i.test(ua)) os = "Android";
      else if (/iphone|ipad|ipod/i.test(ua)) os = "iOS";
      else if (/mac os/i.test(ua)) os = "MacOS";
      return { browser, os };
    }
    function sendEvent(eventName) {
      const { browser, os } = parseUserAgent();
      fetch(apiUrl, {
        method: "POST", mode: "no-cors",
        body: JSON.stringify({ event: eventName, visitorId, page: "index.html", browser, os }),
        headers: { "Content-Type": "application/json" }
      });
    }
    sendEvent("Landing Page Viewed");

    document.getElementById("viewProfileBtn").addEventListener("click", () => {
      Swal.fire({
        title: 'Proceed to Profile?',
        text: "Click below to view Chokchai.T's portfolio.",
        icon: 'info',
        confirmButtonText: 'Yes, View Profile',
        confirmButtonColor: getComputedStyle(root).getPropertyValue('--accent').trim(),
        background: getComputedStyle(root).getPropertyValue('--bg2').trim(),
        color: getComputedStyle(root).getPropertyValue('--text').trim()
      }).then((result) => {
        if (result.isConfirmed) {
          sendEvent("View Profile Clicked");
          window.location.href = "profile.html";
        }
      });
    });
  </script>
</body>
</html>
